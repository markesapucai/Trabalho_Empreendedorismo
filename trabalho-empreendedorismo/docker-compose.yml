services:
  postgres:
    image: postgres:17-alpine
    container_name: ecoobra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoobra}
      POSTGRES_USER: ${POSTGRES_USER:-ecoobra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoobra_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ecoobra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoobra} -d ${POSTGRES_DB:-ecoobra}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecoobra-postgres-data:
