spring.application.name=trabalho-empreendedorismo

# PostgreSQL. Os valores padrão correspondem ao docker-compose.yml para uso local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ecoobra}
spring.datasource.username=${DB_USERNAME:ecoobra}
spring.datasource.password=${DB_PASSWORD:ecoobra_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é criado e versionado pelo Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Origens liberadas no CORS (separadas por vírgula). Em produção, use a URL do frontend.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
